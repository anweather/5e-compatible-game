name: quality

# C# quality gate (docs/QUALITY.md), and the kit's lint as a report that never fails the job (D21). The duplicate-code
# job is duplicates.yml (it scans the sandbox too, so it triggers on sandbox/src; these jobs don't).
# The sandbox's own tests run in sandbox.yml.

on:
  push:
    branches: [main, dev]
    paths:
      - "core/**"
      - "packages/**"
      - "unity/Assets/Prototype/**"
      - "unity/Assets/Default.globalconfig"
      - "rules/**"
      - ".editorconfig"
      - ".github/workflows/quality.yml"
      - "tools/lint/**"
  pull_request:
    paths:
      - "core/**"
      - "packages/**"
      - "unity/Assets/Prototype/**"
      - "unity/Assets/Default.globalconfig"
      - "rules/**"
      - ".editorconfig"
      - ".github/workflows/quality.yml"
      - "tools/lint/**"

jobs:
  build-and-test:
    name: Game.Core build (warnings fail) and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x
          # The NuGet packages folder, keyed on what names the packages (no lock files: core has none).
          cache: true
          cache-dependency-path: |
            core/**/*.csproj
            core/Directory.Build.props
      - run: dotnet build core -c Release -warnaserror
      # sweep.runsettings: everything, the Sweep category too (plain `dotnet test core` skips it, docs/TESTING_LAYERS.md).
      - run: dotnet test core -c Release --no-build -s core/sweep.runsettings --logger "console;verbosity=normal"

  format:
    name: Formatting and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x
          # The NuGet packages folder, keyed on what names the packages (no lock files: core has none).
          cache: true
          cache-dependency-path: |
            core/**/*.csproj
            core/Directory.Build.props
      - run: dotnet format core --verify-no-changes --verbosity diagnostic

  lint:
    name: The kit's lint (prints, never fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - run: node tools/lint/lint.mjs
        continue-on-error: true

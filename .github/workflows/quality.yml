name: quality

# C# quality gate (docs/QUALITY.md). The duplicate-code job is duplicates.yml (it scans the sandbox too, so it triggers
# on sandbox/src; these jobs don't). The sandbox's own tests run in sandbox.yml.

on:
  push:
    branches: [main, dev]
    paths:
      - "core/**"
      - "unity/Assets/Prototype/**"
      - "unity/Assets/Default.globalconfig"
      - "rules/**"
      - ".editorconfig"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "core/**"
      - "unity/Assets/Prototype/**"
      - "unity/Assets/Default.globalconfig"
      - "rules/**"
      - ".editorconfig"
      - ".github/workflows/quality.yml"

jobs:
  build-and-test:
    name: Game.Core build (warnings fail) and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x
          # The NuGet packages folder, keyed on what names the packages (no lock files: core has none).
          cache: true
          cache-dependency-path: |
            core/**/*.csproj
            core/Directory.Build.props
      - run: dotnet build core -c Release -warnaserror
      - run: dotnet test core -c Release --no-build --logger "console;verbosity=normal"

  format:
    name: Formatting and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x
          # The NuGet packages folder, keyed on what names the packages (no lock files: core has none).
          cache: true
          cache-dependency-path: |
            core/**/*.csproj
            core/Directory.Build.props
      - run: dotnet format core --verify-no-changes --verbosity diagnostic

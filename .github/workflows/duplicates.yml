name: duplicates

# The duplicate-code gate (docs/QUALITY.md, layer 2) and the tools' node tests. Apart from quality.yml because jscpd
# scans sandbox/src too: a sandbox change triggers this, not the dotnet jobs. Its paths are quality.yml's as they were,
# plus what its own steps run.

on:
  push:
    branches: [main, dev]
    paths:
      - "core/**"
      - "unity/Assets/Prototype/**"
      - "unity/Assets/Default.globalconfig"
      - "rules/**"
      - "sandbox/src/**"
      - ".editorconfig"
      - ".jscpd.json"
      - "tools/jscpd/**"
      - "tools/chat-report*"
      - "tools/workers/**"
      - ".github/workflows/duplicates.yml"
  pull_request:
    paths:
      - "core/**"
      - "unity/Assets/Prototype/**"
      - "unity/Assets/Default.globalconfig"
      - "rules/**"
      - "sandbox/src/**"
      - ".editorconfig"
      - ".jscpd.json"
      - "tools/jscpd/**"
      - "tools/chat-report*"
      - "tools/workers/**"
      - ".github/workflows/duplicates.yml"

jobs:
  duplicates:
    name: Duplicate code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/jscpd/package-lock.json
      # jscpd is pinned in tools/jscpd/package-lock.json; settings and threshold are in .jscpd.json.
      - run: tools/jscpd/run.sh unity/Assets/Prototype sandbox/src
      - run: node --test tools/chat-report.test.mjs
      - run: node --test tools/workers/gates.test.mjs

name: sandbox

# The sandbox is frozen (J-042): it runs its own copy of the rules in
# sandbox/rules-frozen/, so changes to rules/ no longer trigger it.

on:
  push:
    branches: [main, dev]
    paths: ["sandbox/**", ".github/workflows/sandbox.yml"]
  pull_request:
    paths: ["sandbox/**", ".github/workflows/sandbox.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sandbox/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
